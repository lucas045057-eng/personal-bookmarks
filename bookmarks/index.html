<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>我的书签</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1f2328; }
    form { display: grid; gap: 0.5rem; margin-bottom: 1rem; }
    label { display: grid; gap: 0.2rem; }
    input { font: inherit; padding: 0.4rem; }
    button { font: inherit; cursor: pointer; }
    #message { min-height: 1.6em; }
    .error { color: #b42318; }
    .ok { color: #1a7f37; }
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: 0.75rem; align-items: baseline; padding: 0.4rem 0; border-bottom: 1px solid #e5e7eb; }
    li a { font-weight: 600; word-break: break-word; }
    .url { color: #59636e; font-size: 0.85em; flex: 1; word-break: break-all; }
  </style>
</head>
<body>
  <h1>我的书签</h1>
  <form id="add-form" novalidate>
    <label>标题 <input id="title" name="title" autocomplete="off" required></label>
    <label>链接 <input id="url" name="url" type="url" placeholder="https://example.com" autocomplete="off" required></label>
    <button type="submit">添加</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <ul id="list"></ul>
  <p id="empty">还没有书签。</p>
  <p><a href="../">返回首页</a></p>
  <script src="./app.js"></script>
</body>
</html>
